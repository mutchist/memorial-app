<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Jonas Stemmer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
<header class="top">
  <div class="brand">
    <span class="brand-name">Jonas Stemmer</span>
    <span class="brand-sub">Admin</span>
  </div>
  <nav class="nav">
    <a href="index.html" target="_blank" rel="noopener">View site ↗</a>
    <button class="linkbtn" id="momentsTool" type="button" hidden>Tape moments</button>
    <button class="linkbtn" id="filesTool" type="button" hidden>Scan files</button>
    <span class="who" id="who"></span>
    <button class="linkbtn" id="signout" hidden>Sign out</button>
  </nav>
</header>

<section class="signin" id="signin" hidden>
  <form id="signinForm" class="panel">
    <h1>Sign in</h1>
    <label>Email<input type="email" id="email" autocomplete="username" required></label>
    <label>Password<input type="password" id="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Sign in</button>
    <p class="err" id="signinErr" role="alert"></p>
  </form>
</section>

<section class="notice" id="notice" hidden></section>

<main class="adm" id="app" hidden>
  <aside class="library">
    <div class="lib-head">
      <input type="search" id="search" placeholder="Search names…" aria-label="Search">
      <div class="newwrap">
        <select id="newType" aria-label="Add new"></select>
      </div>
    </div>
    <div class="filters">
      <select id="fType" aria-label="Type"></select>
      <select id="fStatus" aria-label="Status"></select>
      <select id="fCertainty" aria-label="Certainty"></select>
    </div>
    <div class="bulk" id="bulk" hidden>
      <span id="bulkCount"></span>
      <span class="bulk-actions" id="bulkActions"></span>
      <button class="linkbtn" id="bulkClear">Clear</button>
    </div>
    <div class="listbar"><label class="selall"><input type="checkbox" id="selAll"> Select all shown</label><span class="count" id="count"></span></div>
    <ul class="list" id="list"></ul>
  </aside>

  <section class="editor" id="editor">
    <div class="empty-ed">
      <h2>Choose something on the left</h2>
      <p>Or add something new with the menu above the list.</p>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>

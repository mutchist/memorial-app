<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jonas Stemmer · In His Own Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-name">Jonas Stemmer</span>
    <span class="brand-sub">In his own words · 1917–1945</span>
  </div>
  <nav class="nav">
    <a class="on" href="#">Watch</a>
    <a class="soon" title="Coming next">Explore</a>
    <a class="soon" title="Coming next">About</a>
  </nav>
</header>

<main class="watch">
  <section class="left">
    <div class="player" id="player">
      <div class="poster" id="poster">
        <div class="poster-inner">
          <div class="poster-tape" id="posterTape"></div>
          <div class="poster-note" id="posterNote">Loading the video…</div>
        </div>
      </div>
      <div id="yt"></div>
    </div>
  </section>

  <section class="right">
    <div class="mapwrap stage mode-map" id="stage">
      <div class="stage-layer stage-map">
        <div id="map"></div>
        <div class="map-overlay">
          <div class="when" id="when"></div>
          <div class="where" id="where"></div>
        </div>
        <div class="map-legend" id="mapLegend"></div>
      </div>
      <figure class="stage-layer stage-pic" id="stagePic"></figure>
    </div>
  </section>

  <div class="ticker" id="ticker" aria-label="Mentioned now" aria-live="polite">
    <span class="tk-label">Now</span>
    <div class="tk-items" id="tickerItems"></div>
  </div>

  <div class="yearstrip" id="yearStrip" aria-label="Years in the story: events, and where the story is now"></div>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="close" id="close" aria-label="Close">×</button>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="scrim" id="scrim"></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
